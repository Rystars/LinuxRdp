# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "rystars" branch
  push:
    branches: [ "rystars" ]
  pull_request:
    branches: [ "rystars" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Runs a single command using the runners shell
      - name: getngerok
        run: sudo apt update && sudo apt upgrade && wget https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz && sudo tar -xvzf ngrok-v3-stable-linux-amd64.tgz -C /usr/bin

      # Runs a set of commands using the runners shell
      - name: config ngro account
        run: ngrok config add-authtoken ${{ secrets.NGROK_ACCOUNT }}

      - name: install xrdp
        run: sudo apt install -y xrdp

      - name: setting firewall
        run: sudo ufw allow 3389/tcp && sudo ufw reload
        
      - name: run xrdp
        run: sudo systemctl enable --now xrdp && sudo systemctl status xrdp && sudo systemctl start xrdp

      - name: install xface
        run: sudo apt install -y xfce4 xfce4-goodies && echo "xfce4-session" > ~/.xsession && sudo apt install -y ubuntu-desktop && sudo apt install -y kde-plasma-desktop

      - name: setting xface
        run: sudo sed -i '$i startxfce4' /etc/xrdp/startwm.sh

      - name: dhdhjd
        run: ngrok tcp 3389
